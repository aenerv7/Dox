<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FFmpeg</title>
  <link rel="stylesheet" href="ffmpeg-consent.css">
  <script defer src="ffmpeg-consent.js"></script>
</head>
<body>
  <dialog aria-labelledby="heading" aria-describedby="notice">
    <h1 id="heading"></h1>
    <p><bdi id="target" dir="ltr"></bdi></p>
    <p id="notice"></p>
    <ul id="details"></ul>
    <form method="dialog">
      <button id="cancel" value="cancel" autofocus></button>
      <button id="allow" value="allow" disabled></button>
    </form>
  </dialog>
</body>
</html>
